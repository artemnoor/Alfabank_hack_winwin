[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alfalab-api"
version = "1.0.0"
description = "Typed HTTP execution slice for the AlfaLab framework."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alfalab-contracts==1.0.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
