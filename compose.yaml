services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_admin_password
      - development_password
      - testing_password
    ports:
      - "127.0.0.1:${ALFALAB_PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

secrets:
  postgres_admin_password:
    file: .local/t00/postgres-admin-password
  development_password:
    file: .local/t00/development-password
  testing_password:
    file: .local/t00/testing-password

volumes:
  postgres_data:

networks:
  local_database:
    driver: bridge
